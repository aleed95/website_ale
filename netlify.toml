# Netlify configuration — https://docs.netlify.com/configure-builds/file-based-configuration/
# Deploys: every push to `main` (production) and every pull request (deploy preview).
# Content: a Sanity webhook calls a Netlify build hook on publish (see DEPLOYMENT.md).

[build]
  base = "/"
  # Builds the site, then moves the adapter's output (the /anteprima/ preview function)
  # to .netlify/v1 at the repository root, where Netlify looks for it.
  command = "npm run build:netlify"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "24"
  # Install only the website workspace: the Studio is deployed separately on
  # sanity.studio, so its (large) dependencies are not needed to build the site.
  NPM_FLAGS = "--workspace=web --include-workspace-root"
  # Sanity settings are not secret; the optional read token goes in the Netlify UI only.
  SANITY_PROJECT_ID = "l7rmy6qq"
  SANITY_DATASET = "production"
  SANITY_API_VERSION = "2026-11-01"

# ── Redirects ────────────────────────────────────────────────────────────────

# Easy-to-remember entry to the content editor (Sanity Studio).
[[redirects]]
  from = "/admin"
  to = "https://alessandrodini.sanity.studio/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://alessandrodini.sanity.studio/"
  status = 302
  force = true

# ── Headers ──────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    # The page-level CSP is a <meta> tag generated by Astro; frame-ancestors only
    # works as a header.
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed build assets (CSS, JS, fonts, images) never change: cache for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
